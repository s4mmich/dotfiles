listener {
    timeout = 600                                 # 10min
    on-timeout = pidof hyprlock || hyprlock            # lock screen when timeout has passed
}

listener {
    timeout = 660                                                     # 11min
    on-timeout = hyprctl dispatch dpms off && hyprctl hyprsunset -g 10                            # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && hyprctl hyprsunset -g 100          # screen on when activity is detected after timeout has fired.
}

